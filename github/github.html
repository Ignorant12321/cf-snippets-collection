<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云间引渡</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2311130f'/%3E%3Cpath d='M11 12h-1a5 5 0 0 0 0 10h5' fill='none' stroke='%2378c66d' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M17 10h5a5 5 0 0 1 0 10h-1' fill='none' stroke='%2378c8c4' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M12 17h8' fill='none' stroke='%23d7ad58' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M18 14l3 3-3 3' fill='none' stroke='%23d7ad58' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#0f1114;--surface:#15191e;--surface2:#1a2027;--field:#0b0e12;--line:#2a3139;--line2:#3a444f;--text:#e7edf3;--muted:#8f99a5;--accent:#2fbc73;--accent2:#58a6ff;--warn:#f0883e;--danger:#ff7b72;--shadow:0 24px 70px rgba(0,0,0,.34)}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--text);font:14px/1.55 "Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(90deg,rgba(143,153,165,.06) 1px,transparent 1px),linear-gradient(180deg,rgba(143,153,165,.045) 1px,transparent 1px),var(--bg);background-size:32px 32px,32px 32px,auto}
    button,input{font:inherit}button{border:0;cursor:pointer}.app{width:min(1120px,100%);min-height:100dvh;margin:auto;padding:18px;display:grid;grid-template-rows:auto auto auto 1fr;gap:12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:8px;background:rgba(21,25,30,.94);box-shadow:var(--shadow);padding:14px}.brand{display:grid;gap:2px;min-width:0}.mark{color:var(--accent2);font:11px Consolas,monospace;letter-spacing:0}.title{margin:0;font:700 32px/1.05 "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:0}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid var(--line);border-radius:8px;background:rgba(26,32,39,.92);padding:6px 9px;color:var(--muted);font-size:12px;white-space:nowrap}.chip b{color:var(--text)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:12px}.convert-card,.inspector,.panel{border:1px solid var(--line);border-radius:8px;background:rgba(21,25,30,.94);box-shadow:var(--shadow)}.convert-card{display:grid;gap:13px;padding:14px}.inspector{display:grid;gap:10px;align-content:start;padding:14px}.head,.row,.panelHead,.historyTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.head strong,.panelHead strong{font-size:16px}.examples{display:flex;gap:7px;flex-wrap:wrap}
    .mini,.icon,.open,.tab,.small{border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);transition:border-color .16s,background .16s,color .16s,transform .16s}.mini{min-height:32px;padding:0 10px;color:#cfe8ff;background:rgba(88,166,255,.08);border-style:dashed}.mini:hover,.icon:hover,.tab.active,.small:hover{border-color:var(--accent2);background:#1d2732}.field{display:grid;gap:7px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.box{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px;min-height:44px}.url,.out,.search{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}.url{font-size:16px}.out{color:var(--accent2);font:13px Consolas,monospace}.url::placeholder,.search::placeholder{color:#68717d}.icon{width:36px;height:36px;min-width:36px;color:var(--muted)}.open{min-height:42px;font-weight:700;background:linear-gradient(180deg,#238a57,#1f6f48);color:white}.open:hover{border-color:var(--accent);background:linear-gradient(180deg,#2aa366,#238254);transform:translateY(-1px)}.open:disabled,.icon:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .info{border:1px solid rgba(143,153,165,.13);border-radius:8px;background:rgba(255,255,255,.025);padding:10px;display:grid;gap:8px}.info div{display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px}.info span{color:var(--muted)}.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace}.notice{display:none;border:1px solid rgba(255,123,114,.45);border-radius:8px;padding:9px 10px;color:#ffd4d0;background:rgba(255,123,114,.1);font-size:13px}.notice.show{display:block}
    .tabbar{display:flex;gap:8px;overflow-x:auto;padding:1px}.tab{min-height:34px;padding:0 12px;white-space:nowrap;color:var(--muted)}.tab.active{color:var(--text)}.panel{display:none;min-height:310px;overflow:hidden}.panel.active{display:grid;grid-template-rows:auto 1fr}.panelHead{padding:12px;border-bottom:1px solid rgba(143,153,165,.13);background:rgba(255,255,255,.02)}.tools{display:flex;gap:8px;flex-wrap:wrap}.small{min-height:32px;padding:0 10px;color:var(--muted)}.small.danger:hover{border-color:var(--danger);color:#ffd4d0;background:rgba(255,123,114,.1)}.body{overflow:auto;padding:12px}.list,.grid{display:grid;gap:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid rgba(143,153,165,.13);border-radius:8px;background:rgba(255,255,255,.025);padding:10px;display:grid;gap:7px}.card .urlLine{color:var(--accent2);font:12px Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card footer{display:flex;gap:7px;flex-wrap:wrap}.muted,.empty{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid rgba(143,153,165,.13);padding:10px;text-align:left}th{color:var(--muted);font-size:12px}th:first-child,td:first-child{width:52px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;pointer-events:none;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:9px 12px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{padding:10px;gap:10px}.topbar,.workspace,.panelHead{display:grid;grid-template-columns:1fr}.chips{justify-content:flex-start}.convert-card,.inspector{padding:12px}.title{font-size:28px}.head{align-items:flex-start;flex-direction:column}.box{padding:7px}.grid{grid-template-columns:1fr}.open{width:100%}.tools{width:100%}.tools .box{width:100%}.search{min-height:28px}.panel{min-height:300px}}
  </style>
</head>
<body>
<script id="cfg" type="application/json">{"base":__PROXY_BASE_HOST__,"err":__ERROR_MESSAGE__}</script>
<div class="app" data-ui="github-console">
  <header class="topbar">
    <div class="brand"><div class="mark">GITHUB EDGE PROXY</div><h1 class="title">云间引渡</h1></div>
    <div class="chips" aria-label="运行状态"><span class="chip">入口 <b id="homeHost">local</b></span><span class="chip">根域 <b id="baseHost">-</b></span><span class="chip">白名单 <b id="wlNum">0</b></span></div>
  </header>
  <section class="workspace">
    <form class="convert-card" id="goForm" action="/go" method="get" target="_blank">
      <div class="head"><strong>代理入口</strong><div class="examples"><button class="mini" type="button" data-e="github.com/octocat/Hello-World">Repo</button><button class="mini" type="button" data-e="raw.githubusercontent.com/octocat/Hello-World/master/README">Raw</button><button class="mini" type="button" data-e="gist.githubusercontent.com/octocat/6cad326836d38bd3a7ae/raw/example.md">Gist</button></div></div>
      <div id="notice" class="notice"></div>
      <label class="field"><span class="meta"><span>输入链接</span><span id="stateText">等待输入</span></span><span class="box"><input class="url" id="u" name="url" autocomplete="off" spellcheck="false" placeholder="github.com/user/repo 或 raw.githubusercontent.com/user/repo/main/file.js"><button class="icon" id="clear" type="button" title="清空" aria-label="清空">×</button></span></label>
      <label class="field"><span class="meta"><span>代理链接</span><span id="outText">未生成</span></span><span class="box"><input class="out" id="out" readonly value="输入后会自动生成代理链接"><button class="icon" id="openSmall" type="button" title="打开" aria-label="打开">↗</button></span></label>
      <button class="open" id="openBtn" type="submit" disabled>打开代理链接</button>
    </form>
    <aside class="inspector">
      <div class="head"><strong>解析</strong><span class="chip"><b id="ok">空闲</b></span></div>
      <div class="info"><div><span>原域名</span><b class="mono" id="src">-</b></div><div><span>代理域名</span><b class="mono" id="dst">-</b></div><div><span>路径</span><b class="mono" id="path">-</b></div></div>
      <div class="info"><div><span>历史</span><b id="histNum">0</b></div><div><span>镜像</span><b id="mirNum">0</b></div><div><span>协议</span><b id="scheme">HTTPS</b></div></div>
    </aside>
  </section>
  <nav class="tabbar" id="tabs"><button class="tab active" data-tab="hist" type="button">历史</button><button class="tab" data-tab="mir" type="button">镜像</button><button class="tab" data-tab="wl" type="button">白名单</button></nav>
  <section class="panel active" data-panel="hist"><div class="panelHead"><strong>历史记录</strong><div class="tools"><span class="box"><input class="search" id="hs" type="search" placeholder="搜索历史"></span><button class="small danger" id="clearHist" type="button">清空</button></div></div><div class="body"><div class="list" id="hist"></div></div></section>
  <section class="panel" data-panel="mir"><div class="panelHead"><strong>镜像推荐</strong><span class="chip">数量 <b id="mc">0</b></span></div><div class="body"><div class="grid" id="mir"></div></div></section>
  <section class="panel" data-panel="wl"><div class="panelHead"><strong>白名单</strong><div class="tools"><span class="box"><input class="search" id="ws" type="search" placeholder="搜索域名"></span><span class="chip">数量 <b id="wc">0</b></span></div></div><div class="body"><table><thead><tr><th>#</th><th>域名</th></tr></thead><tbody id="wt"></tbody></table></div></section>
</div>
<div class="toast" id="toast"></div>
<script>
const WL=['github.com','avatars.githubusercontent.com','github.githubassets.com','collector.github.com','api.github.com','raw.githubusercontent.com','gist.githubusercontent.com','github.io','assets-cdn.github.com','cdn.jsdelivr.net','securitylab.github.com','www.githubstatus.com','npmjs.com','git-lfs.github.com','githubusercontent.com','github.global.ssl.fastly.net','api.npms.io','github.community','desktop.github.com','central.github.com'];
const MIR=[['ghproxy','https://ghproxy.com/','下载加速入口'],['ghproxy.net','https://ghproxy.net/','备用下载入口'],['ghfast.top','https://ghfast.top/','常用文件镜像'],['FastGit','https://hub.fastgit.xyz/','社区镜像网关']];
const K='github_proxy_history_v3',q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],E=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
let cfg={},hist=[];try{cfg=JSON.parse(q('#cfg').textContent)}catch(e){}try{hist=JSON.parse(localStorage.getItem(K)||'[]').filter(x=>x&&x.i&&x.p)}catch(e){}
function base(){return typeof cfg.base==='string'&&cfg.base&&!cfg.base.includes('__')?cfg.base:(location.hostname.startsWith('home-gh.')?location.hostname.slice(8):'ssr.ddns-ip.net')}
function norm(v){v=(v||'').trim();let m=v.match(/^git@github\.com:([^/]+\/.+)$/i);if(m)return'https://github.com/'+m[1];return v&&!/^https?:\/\//i.test(v)?'https://'+v:v}
function build(v){v=norm(v);if(!v)return{ok:0,r:'empty'};try{let u=new URL(v),h=u.host.toLowerCase();if(!WL.includes(h))return{ok:0,r:'domain',h};let p=new URL(u.href);p.protocol='https:';p.host=h.replaceAll('.','-')+'-gh.'+base();return{ok:1,i:v,p:p.href,h,ph:p.host,path:u.pathname||'/'}}catch(e){return{ok:0,r:'url'}}}
function save(i,p){hist=hist.filter(x=>x.p!==p);hist.unshift({i:norm(i),p,t:Date.now()});hist=hist.slice(0,40);localStorage.setItem(K,JSON.stringify(hist));renderHist();paint()}
function toast(t){let n=q('#toast');n.textContent=t;n.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>n.classList.remove('show'),1200)}
function paint(){let r=build(q('#u').value);q('#baseHost').textContent=base();q('#homeHost').textContent=location.hostname||'local';q('#wlNum').textContent=WL.length;q('#histNum').textContent=hist.length;q('#mirNum').textContent=MIR.length;if(!q('#u').value.trim()){q('#stateText').textContent='等待输入';q('#outText').textContent='未生成';q('#out').value='输入后会自动生成代理链接';q('#ok').textContent='空闲';q('#src').textContent=q('#dst').textContent=q('#path').textContent='-';q('#openBtn').disabled=q('#openSmall').disabled=true;return r}if(!r.ok){q('#stateText').textContent=r.r==='domain'?'域名未放行':'格式无效';q('#outText').textContent='未生成';q('#out').value='当前链接无法代理';q('#ok').textContent='不可用';q('#src').textContent=r.h||'-';q('#dst').textContent=q('#path').textContent='-';q('#openBtn').disabled=q('#openSmall').disabled=true;return r}q('#stateText').textContent='可打开';q('#outText').textContent='已生成';q('#out').value=r.p;q('#ok').textContent='有效';q('#src').textContent=r.h;q('#dst').textContent=r.ph;q('#path').textContent=r.path;q('#openBtn').disabled=q('#openSmall').disabled=false;return r}
function openNow(e){if(e)e.preventDefault();let r=paint();if(!r.ok){toast(r.r==='empty'?'请先输入链接':'链接无法代理');return}save(r.i,r.p);window.open(r.p,'_blank','noopener,noreferrer')}
function renderHist(){let k=q('#hs').value.toLowerCase(),xs=hist.filter(x=>!k||x.i.toLowerCase().includes(k)||x.p.toLowerCase().includes(k));q('#hist').innerHTML=xs.length?xs.map(x=>`<article class="card"><div class="historyTop"><b class="mono" title="${E(x.i)}">${E(x.i)}</b><span class="muted">${new Date(x.t||0).toLocaleString('zh-CN',{hour12:false})}</span></div><div class="urlLine" title="${E(x.p)}">${E(x.p)}</div><footer><button class="small" data-use="${E(x.i)}">填入</button><button class="small" data-open="${E(x.p)}">打开</button><button class="small danger" data-del="${E(x.p)}">删除</button></footer></article>`).join(''):'<div class="empty">暂无历史记录。</div>';q('#histNum').textContent=hist.length}
function renderMir(){q('#mc').textContent=MIR.length;q('#mir').innerHTML=MIR.map(x=>`<article class="card"><b>${E(x[0])}</b><div class="urlLine">${E(x[1])}</div><div class="muted">${E(x[2])}</div><footer><button class="small" data-open="${E(x[1])}">打开</button></footer></article>`).join('')}
function renderWl(){let k=q('#ws').value.toLowerCase(),xs=WL.filter(x=>x.includes(k));q('#wc').textContent=xs.length;q('#wt').innerHTML=xs.map((x,i)=>`<tr><td>${i+1}</td><td class="mono">${E(x)}</td></tr>`).join('')}
qa('[data-e]').forEach(b=>b.onclick=()=>{q('#u').value=b.dataset.e;paint();q('#u').focus()});q('#u').oninput=paint;q('#clear').onclick=()=>{q('#u').value='';paint();q('#u').focus()};q('#goForm').onsubmit=openNow;q('#openSmall').onclick=openNow;q('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;qa('.tab').forEach(x=>x.classList.toggle('active',x===b));qa('[data-panel]').forEach(p=>p.classList.toggle('active',p.dataset.panel===b.dataset.tab))};q('#hs').oninput=renderHist;q('#ws').oninput=renderWl;q('#clearHist').onclick=()=>{if(!hist.length)return toast('历史为空');if(confirm('确认清空本地历史记录？')){hist=[];localStorage.setItem(K,'[]');renderHist();paint();toast('已清空')}};document.body.onclick=e=>{let u=e.target.dataset.use,o=e.target.dataset.open,d=e.target.dataset.del;if(u){q('#u').value=u;paint();scrollTo({top:0,behavior:'smooth'})}if(o)window.open(o,'_blank','noopener,noreferrer');if(d){hist=hist.filter(x=>x.p!==d);localStorage.setItem(K,JSON.stringify(hist));renderHist();paint();toast('已删除')}};
if(typeof cfg.err==='string'&&cfg.err&&!cfg.err.includes('__')){q('#notice').textContent=cfg.err;q('#notice').classList.add('show')}renderHist();renderMir();renderWl();paint();
</script>
</body>
</html>
